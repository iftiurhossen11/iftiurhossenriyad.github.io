name: Deploy public portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PDF generator dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir public-site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='private-admin/' \
            --exclude='scripts/' \
            --exclude='dist-admin/' \
            --exclude='admin.html' \
            --exclude='test-newsletter.html' \
            --exclude='signature.html' \
            --exclude='*.docx' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='node_modules/' \
            ./ public-site/
          npm run build:cv -- public-site public-site/Iftiur_Hossen_Riyad_CV.pdf
          sed -i "s/__CV_VERSION__/${GITHUB_SHA}/g" public-site/index.html
          touch public-site/.nojekyll

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
